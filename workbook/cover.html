<section class="page cover">
  <div class="shape"></div>
  <div class="shape-2"></div>

  <div class="eyebrow">Free workbook for Canadian families</div>
  <h1>{{ c.workbook.title }}</h1>
  <p class="subtitle">{{ c.workbook.subtitle }}.</p>

  <ul class="promise">
    <li><img src="assets/icons/check.svg" alt="">5 short modules, done in any order</li>
    <li><img src="assets/icons/check.svg" alt="">Tiny 5-minute steps, no spreadsheets</li>
    <li><img src="assets/icons/check.svg" alt="">Plain English, zero judgement</li>
  </ul>

  <div class="byline">
    <div class="name">{{ c.advisor.name }}</div>
    <div class="licence">{{ c.disclosure.licence_line }}</div>
  </div>
</section>
